name: Deploy Image Embedding API DEV

# ⛔ NOT workflow_run. GitHub evaluates a workflow_run trigger from the DEFAULT
#    branch, so the deprecated pattern fires a second, duplicate deploy labelled
#    with the default branch, and hands the job the wrong ref for the Environment
#    check (image-embedding had a push-to-main legacy deploy.yml).
#    Trigger on push and poll CI for the exact SHA.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact green dev commit SHA to deploy"
        required: true
        type: string
      force:
        description: "Deploy even when the commit changes only docs/workflows"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: image-embedding-api-deploy-dev
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify exact dev SHA and green CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      deploy_required: ${{ steps.release.outputs.deploy_required }}
    env:
      EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.sha }}
      FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - id: release
        name: Resolve and verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          test "$EXPECTED_SHA" = "$head_sha"
          if test "$GITHUB_EVENT_NAME" = push; then
            test "$GITHUB_REF" = refs/heads/dev
          fi

          ci_conclusion=
          for attempt in $(seq 1 150); do
            ci_run=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch dev \
              --commit "$head_sha" \
              --event push \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] | [.databaseId, .status, (.conclusion // "")] | @tsv')
            if test -n "$ci_run"; then
              read -r ci_run_id ci_status ci_conclusion <<< "$ci_run"
              echo "CI run $ci_run_id status=$ci_status conclusion=${ci_conclusion:-pending}"
              if test "$ci_status" = completed; then
                test "$ci_conclusion" = success
                break
              fi
            else
              echo "Waiting for the exact push CI run for $head_sha"
            fi
            test "$attempt" -lt 150
            sleep 10
          done
          test "$ci_conclusion" = success
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

          # Skip container recreation when a push changed nothing that ships.
          # ⚠️ This compares the PUSH RANGE, not the repo against the host. A
          #    runtime change that failed CI, followed by a docs-only push, is
          #    left STRANDED and reports green. `force: true` is the way out.
          deploy_required=true
          if test "$GITHUB_EVENT_NAME" = push && test "$FORCE_DEPLOY" != true && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            runtime_paths=$(git diff --name-only "$BEFORE_SHA" "$head_sha" | \
              grep -Ev '^(docs/|\.github/|[^/]+\.md$|coverage\.xml$)' || true)
            if test -z "$runtime_paths"; then
              deploy_required=false
            fi
          fi
          echo "deploy_required=$deploy_required" >> "$GITHUB_OUTPUT"
          echo "deploy_required=$deploy_required"

  deploy:
    name: Deploy to DEV
    if: ${{ needs.verify-ci.outputs.deploy_required == 'true' }}
    needs: verify-ci
    runs-on: ubuntu-latest
    environment: dev
    env:
      EXPECTED_SHA: ${{ needs.verify-ci.outputs.sha }}
    steps:
      # Forced commands of the despliegue-lookia account (platform, 2026-11): one line each, no shell.
      - name: Update the checkout on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: despliegue-lookia
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          command_timeout: 40m
          script: actualizar-checkout-image-embeeding-service
      - name: Deploy the exact revision
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: despliegue-lookia
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          command_timeout: 40m
          script: desplegar-dev-image-embeeding-service ${{ env.EXPECTED_SHA }}
