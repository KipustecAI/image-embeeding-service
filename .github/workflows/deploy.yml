name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -euo pipefail

            cd /root/projects/microservices/image-embeeding-service

            echo "=== Pulling latest changes ==="
            git pull origin main

            echo "=== Building Docker image ==="
            make build-image

            echo "=== Running migrations ==="
            echo "=== Syncing canonical LookIA orchestrator ==="
            cd /root/projects/microservices/video-server_microservicios-orchestrated
            git pull --ff-only origin main

            echo "=== Running canonical migration: ms-embedding-api ==="
            make dev-run SERVICE=ms-embedding-api ARGS="alembic upgrade head"

            echo "=== Updating canonical LookIA service(s) ==="
            make dev-update SERVICE=ms-embedding-api

            echo "Canonical DEV deploy complete."
