name: Deploy Image Embedding API PROD

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact green main commit SHA to deploy"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: image-embedding-api-deploy-prod
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify exact main SHA and green CI
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - id: release
        name: Resolve and verify release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          test "$REQUESTED_SHA" = "$head_sha"
          conclusion=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --branch main \
            --commit "$head_sha" \
            --event push \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          test "$conclusion" = success
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to PROD
    needs: verify-ci
    runs-on: ubuntu-latest
    environment: prod
    env:
      EXPECTED_SHA: ${{ needs.verify-ci.outputs.sha }}
    steps:
      - name: Require explicit PROD environment enablement
        env:
          PROD_DEPLOY_ENABLED: ${{ secrets.PROD_DEPLOY_ENABLED }}
        run: test "$PROD_DEPLOY_ENABLED" = "true"

      # Forced commands of the despliegue-lookia-prod account (platform, 2026-11): one line each, no shell.
      - name: Update the checkout on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: despliegue-lookia-prod
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          command_timeout: 30m
          script: actualizar-checkout-image-embeeding-service
      - name: Deploy the exact revision
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: despliegue-lookia-prod
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          command_timeout: 30m
          script: desplegar-prod-image-embeeding-service ${{ env.EXPECTED_SHA }}
